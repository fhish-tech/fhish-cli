name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          mkdir -p dist
          # Build for macOS (Silicon)
          GOOS=darwin GOARCH=arm64 go build -o dist/fhish-darwin-arm64 ./main.go
          # Build for macOS (Intel)
          GOOS=darwin GOARCH=amd64 go build -o dist/fhish-darwin-amd64 ./main.go
          # Build for Linux
          GOOS=linux GOARCH=amd64 go build -o dist/fhish-linux-amd64 ./main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/fhish-darwin-arm64
            dist/fhish-darwin-amd64
            dist/fhish-linux-amd64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
