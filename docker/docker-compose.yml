# fhish-cli/docker/docker-compose.yml

networks:
  fhish:
    driver: bridge

volumes:
  minievm-data:
  shared-data:
  gateway-keys:
  rollytics-db-data:

services:

  # 1. MiniEVM Node
  minievm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.minievm
    container_name: fhish-minievm
    restart: unless-stopped
    networks: [fhish]
    ports:
      - "26657:26657"
      - "8545:8545"
      - "8546:8546"
      # Port 1317 is now handled by the gateway-proxy
    volumes:
      - minievm-data:/data/minievm
    environment:
      CHAIN_ID: ${CHAIN_ID:-fhish-1}
      EVM_CHAIN_ID: ${EVM_CHAIN_ID:-1234}
      MONIKER: ${MONIKER:-fhish-node}
      GAS_DENOM: ${GAS_DENOM:-uinit}
      DEPLOYER_ADDRESS: ${DEPLOYER_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:26657/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 2. Rollytics Database
  rollytics-db:
    image: postgres:15-alpine
    container_name: fhish-rollytics-db
    restart: unless-stopped
    networks: [fhish]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rollytics
    volumes:
      - rollytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Rollytics Indexer
  rollytics-indexer:
    image: ghcr.io/initia-labs/rollytics:v0.19.0
    container_name: fhish-rollytics-indexer
    command: ["indexer"]
    restart: unless-stopped
    networks: [fhish]
    depends_on:
      minievm:
        condition: service_healthy
      rollytics-db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://postgres:postgres@rollytics-db:5432/rollytics?sslmode=disable
      CHAIN_ID: ${CHAIN_ID:-fhish-1}
      VM_TYPE: evm
      RPC_URL: http://minievm:26657
      REST_URL: http://minievm:1317
      JSON_RPC_URL: http://minievm:8545

  # 4. Rollytics API
  rollytics-api:
    image: ghcr.io/initia-labs/rollytics:v0.19.0
    container_name: fhish-rollytics-api
    command: ["api"]
    restart: unless-stopped
    networks: [fhish]
    depends_on:
      rollytics-db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://postgres:postgres@rollytics-db:5432/rollytics?sslmode=disable
      CHAIN_ID: ${CHAIN_ID:-fhish-1}
      VM_TYPE: evm
      RPC_URL: http://minievm:26657
      REST_URL: http://minievm:1317
      JSON_RPC_URL: http://minievm:8545
      CORS_ENABLED: "true"
      CORS_ALLOW_ORIGINS: "*"

  # 5. Gateway Proxy (Unified Port 1317)
  gateway-proxy:
    image: nginx:alpine
    container_name: fhish-gateway-proxy
    restart: unless-stopped
    networks: [fhish]
    ports:
      - "1317:1317"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      minievm:
        condition: service_healthy
      rollytics-api:
        condition: service_started

  # 6. Contract Deployer
  deployer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.deployer
    container_name: fhish-deployer
    networks: [fhish]
    depends_on:
      minievm:
        condition: service_healthy
    volumes:
      - shared-data:/shared
    environment:
      L2_RPC_URL: http://minievm:8545
      EVM_CHAIN_ID: ${EVM_CHAIN_ID:-1234}
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      ADDRESSES_FILE: /shared/addresses.json
    restart: "no"

  # 7. Key Generator
  keygen:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: fhish-keygen
    networks: [fhish]
    volumes:
      - gateway-keys:/app/keys-shortint
    entrypoint: ["npm", "run", "keygen"]
    restart: "no"

  # 8. FHE Gateway
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: fhish-gateway
    restart: unless-stopped
    networks: [fhish]
    ports:
      - "3000:8080"
    depends_on:
      deployer:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
    volumes:
      - gateway-keys:/app/keys-shortint
    environment:
      PORT: 8080
      FHISH_RELAYER_SECRET: ${FHISH_RELAYER_SECRET:-fhish-test-secret}
      RPC_URL: http://minievm:8545
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 9. FHE Relayer
  relayer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.relayer
    container_name: fhish-relayer
    restart: unless-stopped
    networks: [fhish]
    depends_on:
      deployer:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    volumes:
      - shared-data:/shared
    environment:
      ADDRESSES_FILE: /shared/addresses.json
      RPC_URL: http://minievm:8545
      GATEWAY_URL: http://gateway:8080
      PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      FHISH_RELAYER_SECRET: ${FHISH_RELAYER_SECRET:-fhish-test-secret}
