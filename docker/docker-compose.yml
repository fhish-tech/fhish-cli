# fhish-cli/docker/docker-compose.yml

networks:
  fhish:
    driver: bridge

volumes:
  minievm-data:
  shared-data:
  gateway-keys:

services:

  # 1. MiniEVM Node
  minievm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.minievm
    container_name: fhish-minievm
    restart: unless-stopped
    networks: [fhish]
    ports:
      - "26657:26657"
      - "8545:8545"
      - "8546:8546"
      - "1317:1317"
    volumes:
      - minievm-data:/data/minievm
    environment:
      CHAIN_ID: ${CHAIN_ID:-fhish-1}
      EVM_CHAIN_ID: ${EVM_CHAIN_ID:-1234}
      MONIKER: ${MONIKER:-fhish-node}
      GAS_DENOM: ${GAS_DENOM:-uinit}
      DEPLOYER_ADDRESS: ${DEPLOYER_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:26657/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 2. Contract Deployer
  deployer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.deployer
    container_name: fhish-deployer
    networks: [fhish]
    depends_on:
      minievm:
        condition: service_healthy
    volumes:
      - shared-data:/shared
    environment:
      L2_RPC_URL: http://minievm:8545
      EVM_CHAIN_ID: ${EVM_CHAIN_ID:-1234}
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      ADDRESSES_FILE: /shared/addresses.json
    restart: "no"

  # 3. Key Generator
  keygen:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: fhish-keygen
    networks: [fhish]
    volumes:
      - gateway-keys:/app/keys-shortint
    entrypoint: ["npm", "run", "keygen"]
    restart: "no"

  # 4. FHE Gateway
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: fhish-gateway
    restart: unless-stopped
    networks: [fhish]
    ports:
      - "3000:8080"
    depends_on:
      deployer:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
    volumes:
      - gateway-keys:/app/keys-shortint
    environment:
      PORT: 8080
      FHISH_RELAYER_SECRET: ${FHISH_RELAYER_SECRET:-fhish-test-secret}
      RPC_URL: http://minievm:8545
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. FHE Relayer
  relayer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.relayer
    container_name: fhish-relayer
    restart: unless-stopped
    networks: [fhish]
    depends_on:
      deployer:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    volumes:
      - shared-data:/shared
    environment:
      ADDRESSES_FILE: /shared/addresses.json
      RPC_URL: http://minievm:8545
      GATEWAY_URL: http://gateway:8080
      PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      FHISH_RELAYER_SECRET: ${FHISH_RELAYER_SECRET:-fhish-test-secret}

  # 6. FHE Verifier
  verifier:
    build:
      context: ..
      dockerfile: docker/Dockerfile.verifier
    container_name: fhish-verifier
    networks: [fhish]
    depends_on:
      relayer:
        condition: service_started
      gateway:
        condition: service_healthy
    volumes:
      - shared-data:/shared
    environment:
      RPC_URL: http://minievm:8545
      GATEWAY_URL: http://gateway:8080
      ADDRESSES_FILE: /shared/addresses.json
    profiles: ["verify"]
    restart: "no"

  # 7. Blockscout Explorer (Optional)
  explorer-db:
    image: postgres:15-alpine
    container_name: fhish-explorer-db
    restart: always
    environment:
      POSTGRES_PASSWORD: fhish_explorer_pass
      POSTGRES_USER: fhish_explorer_user
      POSTGRES_DB: fhish_explorer_db
    command: postgres -c 'max_connections=200'
    networks: [fhish]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhish_explorer_user -d fhish_explorer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["explorer"]

  explorer-redis:
    image: redis:alpine
    container_name: fhish-explorer-redis
    networks: [fhish]
    profiles: ["explorer"]

  explorer:
    image: blockscout/blockscout:6.9.0
    container_name: fhish-explorer
    restart: always
    user: root
    command: ["/bin/sh", "-c", "bin/blockscout eval Explorer.ReleaseTasks.create_and_migrate && bin/blockscout start"]
    depends_on:
      explorer-db:
        condition: service_healthy
      explorer-redis:
        condition: service_started
    networks: [fhish]
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NETWORK=FHISH
      - SUBNETWORK=Rollup-1
      - COIN=INIT
      - ETHEREUM_JSON_RPC_VARIANT=geth
      - ETHEREUM_JSON_RPC_HTTP_URL=http://minievm:8545
      - DATABASE_URL=postgresql://fhish_explorer_user:fhish_explorer_pass@explorer-db:5432/fhish_explorer_db?ssl=false
      - ECTO_USE_SSL=false
      - SECRET_KEY_BASE=567b4c781d06b952c9d73b000ef26767fd620593f61c6a012011a660199bf50531bd0175d4090ca21460337c57097211a76f010454707351911fa27237ee0644
      - REDIS_URL=redis://explorer-redis:6379/0
      - INDEXER_OPTIMIZATION_CONCURRENT_REQUESTS=10
      - MICROSERVICES_SC_VERIFIER_ENABLED=false
      - CHAIN_ID=1261826453
      - SHOW_PRICE_CHART=false
      - LOG_LEVEL=info
    profiles: ["explorer"]
